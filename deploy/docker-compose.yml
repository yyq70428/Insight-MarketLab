name: insight-marketlab

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-marketlab}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marketlab}
      MONGODB_URI: mongodb://mongo:27017/marketlab
    ports:
      - "127.0.0.1:9021:8000"
      - "127.0.0.1:9022:8000"
    volumes:
      - ../quant/results:/marketlab/quant/results
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
  db:
    image: postgres:16-alpine
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-marketlab}
    ports:
      - "127.0.0.1:9023:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
    name: ${MARKETLAB_POSTGRES_VOLUME:-insight-marketlab_postgres_data}
    external: ${MARKETLAB_EXISTING_VOLUMES:-false}
  mongo_data:
    name: ${MARKETLAB_MONGO_VOLUME:-insight-marketlab_mongo_data}
    external: ${MARKETLAB_EXISTING_VOLUMES:-false}
