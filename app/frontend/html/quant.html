<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketLab｜量化研究</title><link rel="stylesheet" href="/static/css/main.css"><link rel="stylesheet" href="/static/css/quant.css"></head><body><header class="page-top"><a class="brand" href="/"><span class="brand-bars"><i></i><i></i><i></i></span>MarketLab</a><h1>量化研究工作台</h1><nav><a href="/">圖表</a><a href="/scanner">掃描器</a><a href="/reports">每日報告</a><a href="/stock">個股</a></nav></header><main class="quant-main"><section class="quant-controls"><form id="quantForm"><label>標的<input name="symbol" value="0050.TW"></label><label>策略<select name="strategy"><option value="ma">均線交叉</option><option value="rsi">RSI 均值回歸</option><option value="bollinger">布林通道突破</option></select></label><label>資料範圍<select name="range"><option value="2y">2 年</option><option value="5y" selected>5 年</option><option value="10y">10 年</option></select></label><button class="primary">執行滾動驗證</button></form><p>訊號於收盤後產生、下一根開盤成交；包含市場成本與滑價。歷史模擬不代表未來績效。</p></section><div id="quantStatus" class="muted">尚未執行</div><section class="metric-grid" id="metricGrid"></section><section class="equity-panel"><header><h2>策略權益曲線與買入持有比較</h2></header><canvas id="equityChart"></canvas></section><section class="quant-bottom"><article><h2>滾動驗證</h2><div id="walkForward">訓練 2 年、驗證 6 個月，驗證區間不重疊。</div></article><article><h2>穩健性檢查</h2><div id="robustness">最佳參數會與上下 20% 擾動組合比較。</div></article><article><h2>離線研究快照</h2><div id="snapshots">載入中…</div></article></section></main><script type="module" src="/static/js/quant.js"></script></body></html>
